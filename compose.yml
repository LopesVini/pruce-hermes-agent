name: pruce
services:
  agent:
    build: .
    environment:
      # Empty by default: no registration or reporting. Set only after approval.
      AGENT_ID: "${AGENT_ID:-}"
    volumes:
      - type: bind
        source: ${PRUCE_CREDENTIALS_FILE:-../plow-hermes-agent/plow-credentials}
        target: /var/lib/plow/credentials.host
        read_only: true
        bind:
          create_host_path: false
      - agent-home:/var/lib/hermes
    stop_grace_period: 35s

volumes:
  agent-home:

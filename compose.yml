name: pruce
services:
  agent:
    build: .
    platform: linux/amd64
    # The current base reads Plow credentials from the process environment.
    # The file stays outside the image, build context, and persistent home.
    env_file:
      - path: ${PLOW_CREDENTIALS:-${PRUCE_CREDENTIALS_FILE:-./plow-credentials}}
        required: false
    environment:
      # Existing Prucê identity; explicitly set AGENT_ID= to disable reporting.
      AGENT_ID: "${AGENT_ID-pruce}"
      WHATSAPP_ENABLED: "${WHATSAPP_ENABLED:-false}"
      WHATSAPP_MODE: bot
      WHATSAPP_ALLOW_ALL_USERS: "false"
      WHATSAPP_DM_POLICY: allowlist
      WHATSAPP_GROUP_POLICY: disabled
      WHATSAPP_ALLOWED_USERS: "${WHATSAPP_ALLOWED_USERS:-}"
      WHATSAPP_HOME_CHANNEL: "${WHATSAPP_HOME_CHANNEL:-}"
      WHATSAPP_FORWARD_OWNER_MESSAGES: "false"
      WHATSAPP_DEBUG: "false"
    volumes:
      - agent-home:/var/lib/hermes
    stop_grace_period: 35s

volumes:
  agent-home:
